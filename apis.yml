name: Simility
description: 'Simility was a fraud-detection and risk-decisioning company (a "Digital Trust & Safety"
  adaptive machine-learning platform) founded in 2014 in Palo Alto, California and backed by Accel and
  Trinity Ventures. PayPal acquired Simility in 2018 and folded its device fingerprinting, behavioral
  analytics, and real-time fraud-scoring capabilities into PayPal''s risk and fraud-management offerings.
  The standalone Simility product, developer portal, and any public fraud-scoring API have since been
  retired: as of this enrichment pass the simility.com domain is registered defensively by PayPal (via
  MarkMonitor / Google Domains nameservers) but publishes no A record, website, mail, or API host. No
  live public API surface exists to enrich.'
